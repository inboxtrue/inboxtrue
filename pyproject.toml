[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "inboxtrue"
version = "0.1.0"
description = "Command-line client for the InboxTrue email validation API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["click>=8.1", "rich>=13", "urllib3>=2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://inboxtrue.com"
Repository = "https://github.com/inboxtrue/inboxtrue"
Issues = "https://github.com/inboxtrue/inboxtrue/issues"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "twine>=6"]

[project.scripts]
inboxtrue = "inboxtrue.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/inboxtrue"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
